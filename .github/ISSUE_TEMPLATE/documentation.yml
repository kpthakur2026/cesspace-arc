name: Documentation issue
description: Report unclear, incorrect, or missing public documentation.
title: '[Docs] '
labels: ['documentation']
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: File, section, or public page where the issue appears.
      placeholder: 'README.md / Installation'
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
