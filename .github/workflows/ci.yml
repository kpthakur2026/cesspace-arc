name: CesSpace ARC CI Quality Gates

on:
  push:
    branches:
      - feat/*
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explicit Full-Range PR Gitleaks Scan
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          git rev-list --count "$BASE_SHA..$HEAD_SHA"

          GITLEAKS_BIN=$(command -v gitleaks || find /tmp -name gitleaks -type f -perm -111 2>/dev/null | head -n 1)
          if [[ -z "$GITLEAKS_BIN" || ! -x "$GITLEAKS_BIN" ]]; then
            echo "==> Downloading Gitleaks binary..."
            VERSION="8.24.3"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
            GITLEAKS_BIN="/tmp/gitleaks"
          fi

          "$GITLEAKS_BIN" detect \
            --source . \
            --verbose \
            --redact \
            --exit-code 2 \
            --log-opts="--no-merges $BASE_SHA..$HEAD_SHA"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4

  quality-gates:
    name: Architecture & Security Verification
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm 12.4.2
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Git Diff Cleanliness Check
        run: git diff --check

      - name: Code Formatting Check (Prettier)
        run: pnpm run check:format

      - name: Static Analysis & Lint (ESLint)
        run: pnpm run lint

      - name: TypeScript Monorepo Build Check
        run: pnpm run typecheck

      - name: Contract & Invariant Tests (Deterministic)
        run: pnpm run test

      - name: Documentation Integrity & Link Check
        run: bash scripts/check-docs.sh

      - name: Repository Secret & Safety Check
        run: bash scripts/check-secrets.sh

      - name: Dependency Security Audit
        run: pnpm audit
