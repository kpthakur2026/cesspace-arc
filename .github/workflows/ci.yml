name: CesSpace ARC CI Quality Gates

on:
  push:
    branches:
      - feat/*
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explicit Full-Range PR Gitleaks Scan
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          git rev-list --count "$BASE_SHA..$HEAD_SHA"

          GITLEAKS_BIN=$(command -v gitleaks || find /tmp -name gitleaks -type f -perm -111 2>/dev/null | head -n 1)
          if [[ -z "$GITLEAKS_BIN" || ! -x "$GITLEAKS_BIN" ]]; then
            echo "==> Downloading Gitleaks binary..."
            VERSION="8.24.3"
            ARCHIVE="/tmp/gitleaks_${VERSION}_linux_x64.tar.gz"
            EXPECTED_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
            curl --fail --silent --show-error --location \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
              --output "$ARCHIVE"
            echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum --check --strict
            tar -xzf "$ARCHIVE" -C /tmp gitleaks
            GITLEAKS_BIN="/tmp/gitleaks"
          fi

          "$GITLEAKS_BIN" detect \
            --source . \
            --verbose \
            --redact \
            --exit-code 2 \
            --log-opts="--no-merges $BASE_SHA..$HEAD_SHA"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  quality-gates:
    name: Architecture & Security Verification
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup pnpm 12.4.2
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Git Diff Cleanliness Check
        run: git diff --check

      - name: Code Formatting Check (Prettier)
        run: pnpm run check:format

      - name: Static Analysis & Lint (ESLint)
        run: pnpm run lint

      - name: TypeScript Monorepo Build Check
        run: pnpm run typecheck

      - name: Contract & Invariant Tests (Deterministic)
        run: pnpm run test

      - name: Documentation Integrity & Link Check
        run: bash scripts/check-docs.sh

      - name: Repository Secret & Safety Check
        run: bash scripts/check-secrets.sh

      - name: Dependency Security Audit
        run: pnpm audit

  arc10-final-verification:
    name: ARC 1.0 Final Verification
    if: >-
      github.ref == 'refs/heads/feat/arc-1.0-scope' ||
      github.ref == 'refs/heads/main' ||
      github.head_ref == 'feat/arc-1.0-scope'
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup pnpm 12.4.2
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Pinned Gitleaks
        run: |
          set -euo pipefail
          version="8.24.3"
          archive="/tmp/gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$expected_sha256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks

      - name: Run ARC 1.0 Final Verification
        env:
          GITLEAKS_BIN: /tmp/gitleaks
        run: bash scripts/verify-arc10.sh
